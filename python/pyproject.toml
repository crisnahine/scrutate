[project]
name = "scrutate-ref"
dynamic = ["version"]
description = "Training code for the models of the Scrutate code-intelligence engine (not the product: the product is the Rust crate)"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
train = ["scipy", "scikit-learn", "lightgbm"]  # retrain the semantic model / ranker, run bench/
test = ["pytest"]

[build-system]
requires = ["setuptools>=77"]  # 77 reads a licence expression and license-files
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scrutate_ref"]

[tool.setuptools.dynamic]
version = {attr = "scrutate_ref.__version__"}

[tool.setuptools.package-data]
scrutate_ref = []
