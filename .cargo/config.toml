[env]
# build the bundled PCRE2 into the binary; without this, pcre2-sys links a system copy found by
# pkg-config (Homebrew's, for one), and the binary fails on machines without it
PCRE2_SYS_STATIC = "1"
# macOS 13 or newer: from 13 on the binary carries chained fixups, which the kernel applies as pages
# are first touched instead of dyld applying all of them at launch (start-up 2.6 ms to 2.4 ms)
MACOSX_DEPLOYMENT_TARGET = "13.0"
# the reads that tests and `cargo run` make count in a frecency file under target/, never the user's
XDG_STATE_HOME = { value = "target/tmp/state", force = true, relative = true }
