[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "scrutate"
description = "Universal instant code search and persistent code intelligence (Rust engines, Python bindings)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
# the notices are written by tools/third_party_notices.py before a release build
license-files = ["LICENSE-APACHE", "LICENSE-MIT", "THIRD_PARTY_NOTICES*"]
dynamic = ["version"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: OS Independent",
  "Topic :: Software Development",
]

[tool.maturin]
module-name = "scrutate._native"
python-source = "python"
strip = true
