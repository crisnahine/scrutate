[package]
name = "scrutate"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Scrutate: universal instant code search (Engine A) and a persistent code-intelligence index with learned ranking (Engine B), one CLI and MCP server"
license.workspace = true

[[bin]]
name = "scrutate"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "Cris Nahine <80492222+crisnahine@users.noreply.github.com>"
section = "devel"
extended-description = "Instant grep-class search of any repository without an index, plus a persistent index for ranked search, symbols, callers and imports. One CLI and an MCP server."
assets = [
    ["target/release/scrutate", "usr/bin/", "755"],
    ["../../LICENSE-APACHE", "usr/share/doc/scrutate/", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/scrutate/", "644"],
    ["../../README.md", "usr/share/doc/scrutate/", "644"],
    # written by packaging/linux/build-packages.sh
    ["THIRD_PARTY_NOTICES.txt", "usr/share/doc/scrutate/", "644"],
]

[package.metadata.generate-rpm]
summary = "Instant code search and a persistent code-intelligence index"
assets = [
    { source = "target/release/scrutate", dest = "/usr/bin/scrutate", mode = "755" },
    { source = "../../LICENSE-APACHE", dest = "/usr/share/licenses/scrutate/LICENSE-APACHE", mode = "644", doc = true },
    { source = "../../LICENSE-MIT", dest = "/usr/share/licenses/scrutate/LICENSE-MIT", mode = "644", doc = true },
    { source = "../../README.md", dest = "/usr/share/doc/scrutate/README.md", mode = "644", doc = true },
    { source = "THIRD_PARTY_NOTICES.txt", dest = "/usr/share/licenses/scrutate/THIRD_PARTY_NOTICES.txt", mode = "644", doc = true },
]

[dependencies]
aho-corasick = "1"
anyhow = "1"
blake2 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
grep-cli = "0.1"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-pcre2 = "0.1"
grep-searcher = "0.1"
half = "2"
ignore = "0.4"
matrixmultiply = "0.3"
memchr = "2"
memmap2 = "0.9"
rayon = "1"
regex = "1"
regex-syntax = "0.8"
regex-automata = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
rust-stemmers = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tar = "0.4"
termcolor = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
sha1 = "0.10"
unicode-normalization = "0.1"
tree-sitter = "0.26"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-swift = "0.7"
tree-sitter-scala = "0.26"
tree-sitter-lua = "0.5"
tree-sitter-haskell = "0.24"
tree-sitter-ocaml = { version = "0.26", optional = true }
tree-sitter-elixir = "0.3"
tree-sitter-zig = "1.1"
tree-sitter-julia = "0.23"
tree-sitter-dart = "0.3"
tree-sitter-r = "1.3"
tree-sitter-erlang = "0.21"
tree-sitter-nix = "0.3"
tree-sitter-groovy = "0.1"
tree-sitter-objc = "3.0"
tree-sitter-fortran = { version = "0.6", optional = true }
tree-sitter-elm = "5.9"
tree-sitter-powershell = "0.26"
tree-sitter-hcl = "1.1"
tree-sitter-solidity = "1.2"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-md = "0.5"
tree-sitter-cmake = "0.7"
tree-sitter-make = "1.1"
tree-sitter-gleam = "1.0"
tree-sitter-d = { version = "0.8", optional = true }
tree-sitter-pascal = "0.10"
tree-sitter-ada = "0.9"
tree-sitter-verilog = { version = "1.0", optional = true }
tree-sitter-vhdl = { version = "1.4", optional = true }
tree-sitter-matlab = "1.3"
tree-sitter-fsharp = { version = "0.3", optional = true }
tree-sitter-elisp = "1.7"
tree-sitter-scheme = "0.25"
tree-sitter-racket = "0.25"
tree-sitter-commonlisp = "0.4"
tree-sitter-odin = { version = "1.3", optional = true }
tree-sitter-vim = "0.4"
tree-sitter-glsl = "0.2"
tree-sitter-cuda = { version = "0.21", optional = true }
tree-sitter-starlark = "1.3"
tree-sitter-fish = "3.6"
tree-sitter-graphql = "0.3"
tree-sitter-prisma = "0.2"
tree-sitter-puppet = "1.3"
tree-sitter-bicep = "1.1"
tree-sitter-llvm = { version = "1.1", optional = true }
tree-sitter-asm = "0.24"
tree-sitter-qmljs = { version = "0.3", optional = true }
tree-sitter-tlaplus = { version = "1.5", optional = true }
tree-sitter-jsonnet = "0.0.1"
tree-sitter-xml = "0.7"
tree-sitter-ini = "1.4"
tree-sitter-rst = "0.2"
tree-sitter-autohotkey = { version = "1.1", optional = true }
tree-sitter-gdscript = "6.1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# no file events on wasi: `watch` says so there
[target.'cfg(not(target_os = "wasi"))'.dependencies]
notify = { version = "8.2", default-features = false }

# kqueue instead of FSEvents keeps CoreServices out of the binary (the watcher polls on macOS)
[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "8.2", default-features = false, features = ["macos_kqueue"] }

[dev-dependencies]
proptest = "1"

[features]
default = []
# heavy or niche grammars (about 80 MB of parse tables): Fortran, OCaml, F#, Verilog, VHDL, CUDA, TLA+, D, AutoHotkey, Odin, QML, LLVM IR
extra-langs = ["dep:tree-sitter-fortran", "dep:tree-sitter-ocaml", "dep:tree-sitter-fsharp", "dep:tree-sitter-verilog", "dep:tree-sitter-vhdl", "dep:tree-sitter-cuda", "dep:tree-sitter-tlaplus", "dep:tree-sitter-d", "dep:tree-sitter-autohotkey", "dep:tree-sitter-odin", "dep:tree-sitter-qmljs", "dep:tree-sitter-llvm"]
