[workspace]
resolver = "2"
# vendor/ignore is scrutate-ignore, a modified copy of `ignore` published under its own name; its
# eleven changes are listed in its README
members = ["crates/scrutate", "crates/scrutate-py", "vendor/ignore"]
default-members = ["crates/scrutate"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scrutate/scrutate"
rust-version = "1.91"

[profile.release]
opt-level = 3
# one object, so the macOS order file can place every function a small search runs (ThinLTO
# leaves most of them where they fall): a one-file search touched 25 fewer pages
lto = "fat"
codegen-units = 1
debug = 0
strip = true
