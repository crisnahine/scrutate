[workspace]
resolver = "2"
members = ["crates/scrutate", "crates/scrutate-py"]
default-members = ["crates/scrutate"]
exclude = ["vendor/ignore"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/crisnahine/scrutate"
rust-version = "1.89"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 0
strip = true

# `ignore` with two changes (vendor/ignore): the global git excludes path is parsed without
# compiling a regex (excludes_file_span), and an idle walker thread waits 10 us at first, doubling
# up to the original 1 ms, before looking for work again (Worker::get_work).
[patch.crates-io]
ignore = { path = "vendor/ignore" }
