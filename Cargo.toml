[workspace]
resolver = "2"
members = ["crates/scrutate", "crates/scrutate-py"]
default-members = ["crates/scrutate"]
exclude = ["vendor/ignore"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scrutate/scrutate"
rust-version = "1.91"

[profile.release]
opt-level = 3
# one object, so the macOS order file can place every function a small search runs (ThinLTO
# leaves most of them where they fall): a one-file search touched 25 fewer pages
lto = "fat"
codegen-units = 1
debug = 0
strip = true

# `ignore` with nine changes (vendor/ignore): the global git excludes path is parsed without
# compiling a regex (excludes_file_span); an idle walker thread waits 10 us at first, doubling up
# to the original 1 ms, before looking for work again (Worker::get_work); gitignore lines of three
# common shapes are matched without a regex (gitignore::Simple); a parallel walk can start more
# threads while it runs (WalkBuilder::grow_threads); the global git excludes file is read only
# when a walk meets a repository (IgnoreInner::git_global); a walk of `.` takes the current
# directory it was given instead of looking it up again (WalkBuilder::process_current_dir); a
# walker thread that is paused sleeps a thirty-second of the time it has been paused, 50 us to
# 1 ms (pause); the rare error of a queued entry is boxed, so an entry is 96 bytes
# (DirEntry.err); and a walk on one thread queues its entries in a plain vector.
[patch.crates-io]
ignore = { path = "vendor/ignore" }
