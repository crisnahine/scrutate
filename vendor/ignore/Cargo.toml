[package]
name = "scrutate-ignore"
version = "0.4.34"
authors = ["Andrew Gallant <jamslam@gmail.com>"]
description = """
A modified copy of BurntSushi's `ignore` 0.4.34 for scrutate: a fast recursive directory walker
that respects `.gitignore`. Its changes are listed in its README.
"""
repository = "https://github.com/scrutate/scrutate/tree/main/vendor/ignore"
readme = "README.md"
keywords = ["glob", "ignore", "gitignore", "pattern", "file"]
license = "Unlicense OR MIT"
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*.rs", "/tests/*", "/examples/*.rs", "/README.md", "/COPYING", "/LICENSE-MIT", "/UNLICENSE"]
# its bench needs nightly's `test` crate
autobenches = false

[lib]
name = "ignore"
bench = false

[dependencies]
crossbeam-deque = "0.8.3"
globset = "0.4.18"
log = "0.4.20"
memchr = "2.6.3"
same-file = "1.0.6"
walkdir = "2.4.0"

[dependencies.regex-automata]
version = "0.4.18"
default-features = false
features = ["std", "perf", "syntax", "meta", "nfa", "hybrid", "dfa-onepass"]

[target.'cfg(windows)'.dependencies.winapi-util]
version = "0.1.2"

[dev-dependencies]
bstr = { version = "1.6.2", default-features = false, features = ["std"] }
crossbeam-channel = "0.5.15"

# upstream's code is linted upstream; the workspace's clippy run keeps to scrutate's own
[lints.clippy]
all = { level = "allow", priority = -1 }

[features]
# DEPRECATED. It is a no-op. SIMD is done automatically through runtime
# dispatch.
simd-accel = []
