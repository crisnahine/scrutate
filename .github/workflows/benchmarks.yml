# Benchmark regression gate. A shared runner is not the machine a committed baseline came from, so
# the job builds two binaries on the runner it has, the change and the commit it is measured
# against (the base of a pull request, or the last release tag on the weekly run), and times both
# in ONE leaderboard run, in the same interleaved blocks: a slow minute slows both, and two runs
# minutes apart are never compared. Numbers from here never reach docs/LEADERBOARD.md.
name: benchmarks
on:
  pull_request:
    paths: ["crates/scrutate/**", "vendor/**", "Cargo.lock", "Cargo.toml", "rust-toolchain.toml", "bench/**", ".github/workflows/benchmarks.yml"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
# bash -eo pipefail everywhere, Git Bash on Windows: a failing command inside a pipe fails the step
defaults:
  run:
    shell: bash
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    name: this change against its base, on one runner
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install --no-self-update
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: sudo apt-get -o Acquire::Retries=5 install -y ripgrep ugrep silversearcher-ag ack
      - name: hyperfine 2.0.0 (the harness reads its JSON; the distribution ships 1.x)
        run: |
          arch=$(uname -m)
          case "$arch" in
            x86_64) sum=ae2beda2ac99c098427e4f755244552daf20e514422889cca6d44421e2d93c87 ;;
            aarch64) sum=f8244d1e17f8da23ee6b3ae2cdc04a6a185a450f6b74e09bff12e498038fcbc9 ;;
          esac
          name=hyperfine-v2.0.0-$arch-unknown-linux-gnu
          curl -sSfL -o "$RUNNER_TEMP/$name.tar.gz" "https://github.com/sharkdp/hyperfine/releases/download/v2.0.0/$name.tar.gz"
          echo "$sum  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/$name/hyperfine" /usr/local/bin/hyperfine
          hyperfine --version
      - name: build the change and its base
        run: |
          [ -n "$BASE" ] || BASE=$(git describe --tags --abbrev=0 --match 'v*' 2> /dev/null || true)
          cargo build --release -p scrutate --locked
          cp target/release/scrutate "$RUNNER_TEMP/new"
          if [ -n "$BASE" ] && [ "$(git rev-parse "$BASE^{commit}")" != "$(git rev-parse HEAD)" ]; then
            git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
            (cd "$RUNNER_TEMP/base" && cargo build --release -p scrutate --locked --target-dir "$GITHUB_WORKSPACE/target")
            cp target/release/scrutate "$RUNNER_TEMP/old"
          else
            echo "nothing to compare with: the results are recorded and the gate is skipped"
          fi
      - name: corpora (pinned revisions)
        run: |
          git clone --depth 1 --branch networkx-3.4.2 https://github.com/networkx/networkx "$RUNNER_TEMP/networkx"
          python3 bench/corpora.py --root "$RUNNER_TEMP/corpora" --only ripgrep
      # recorded for reading, not gated: it times one binary per run, and the gate needs both in one
      - name: tool comparison on networkx (no gate)
        run: |
          SCRUTATE_BIN="$RUNNER_TEMP/new" python3 bench/compare_tools.py --corpus "networkx=$RUNNER_TEMP/networkx" --only text,index --runs 21 --out compare-new.json
      - name: leaderboard suite on the ripgrep corpus, the change and its base in the same blocks
        if: ${{ !cancelled() }}
        run: |
          if [ -x "$RUNNER_TEMP/old" ]; then export SCRUTATE_BASE_BIN="$RUNNER_TEMP/old"; fi
          SCRUTATE_BIN="$RUNNER_TEMP/new" python3 bench/leaderboard.py --corpora "$RUNNER_TEMP/corpora" --out leaderboard.json --only ripgrep/ --blocks 6 --max-load 2 --max-wait 300
          [ -z "${SCRUTATE_BASE_BIN:-}" ] || python3 bench/leaderboard_regression.py --within leaderboard.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: benchmark-results
          path: |
            compare-new.json
            leaderboard.json
          retention-days: 30
