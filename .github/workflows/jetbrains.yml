# A headless IntelliJ IDEA with LSP4IJ from the Marketplace registers `scrutate lsp` as the
# Language Servers settings page does, opens the integrations/fixture.sh repository and runs Go to
# Declaration (integrations/jetbrains/test). Its own workflow, run when the JetBrains files change
# or by hand, so ci.yml does not wait for an IDE download. The IDE, Gradle and plugin versions are
# those of JetBrains' intellij-platform-plugin-template, whose tests pass on them.
name: jetbrains
on:
  push:
    branches: [main]
    paths:
      - integrations/jetbrains/**
      - .github/workflows/jetbrains.yml
  pull_request:
    paths:
      - integrations/jetbrains/**
      - .github/workflows/jetbrains.yml
  workflow_dispatch:
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: jetbrains-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  lsp4ij:
    name: IntelliJ IDEA 2026.2.3 with LSP4IJ 0.21.0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the IDE and its Gradle caches take several GB next to the release build
      - name: free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release -p scrutate --locked
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: "21"
      # basic: the open-source cache provider over actions/cache
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: 9.8.1
          cache-provider: basic
      - name: Go to Declaration through LSP4IJ
        working-directory: integrations/jetbrains/test
        run: |
          bash "$GITHUB_WORKSPACE/integrations/fixture.sh" "$RUNNER_TEMP/repo"
          export SCRUTATE_BIN=$GITHUB_WORKSPACE/target/release/scrutate SCRUTATE_FIXTURE=$RUNNER_TEMP/repo
          gradle test --no-daemon --stacktrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: jetbrains-test-logs
          path: |
            integrations/jetbrains/test/build/reports/tests/
            integrations/jetbrains/test/build/test-results/
            integrations/jetbrains/test/build/idea-sandbox/*/log*/
          if-no-files-found: ignore
          retention-days: 7
