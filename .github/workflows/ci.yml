# Continuous integration: quality gates for every push and pull request, and once a week so a new
# advisory, runner image or editor release shows up without a code change.
# The core crate only needs Rust; the Python job covers the training code, the bindings, the
# differential harnesses and the ranking quality floor; the wheel job builds, installs and tests
# the bindings on every runner. The editor jobs run the CI binary in the hosts the integrations
# claim: VS Code (the folder and the packaged .vsix) and Neovim on Linux, macOS and Windows, at each
# version floor and the current release. The action job installs a CI binary through the action
# of this commit on all six runners, with curl answering the release URLs. Every action is pinned
# to a commit; .github/dependabot.yml moves the pins. The Rust version, rustfmt and clippy come from
# rust-toolchain.toml.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_call: # release.yml runs every job on the tagged commit before it publishes
permissions:
  contents: read
# bash -eo pipefail everywhere, Git Bash on Windows: a failing command inside a pipe fails the step
defaults:
  run:
    shell: bash
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --exclude scrutate-py -- -D warnings
      # the Grep hook's tests compare its answers with ripgrep's; SCRUTATE_TEST_NEEDS_RG fails them if rg is missing
      - name: ripgrep for the Grep hook's tests (Windows)
        if: runner.os == 'Windows'
        run: |
          case "$RUNNER_ARCH" in
            X64) t=x86_64-pc-windows-msvc; sum=71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5 ;;
            ARM64) t=aarch64-pc-windows-msvc; sum=e4abca10c3a64ebea742667dd7009449d49403db5460dd6873e389fa2945360f ;;
          esac
          cd "$RUNNER_TEMP"
          curl -sSfL -o rg.zip "https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-$t.zip"
          echo "$sum  rg.zip" | sha256sum -c -
          unzip -q rg.zip
          echo "$RUNNER_TEMP/ripgrep-15.2.0-$t" >> "$GITHUB_PATH"
          echo "SCRUTATE_TEST_NEEDS_RG=1" >> "$GITHUB_ENV"
      # the core must build and pass its tests with no Python involved (the bindings crate is excluded)
      # every test file runs, so one failure does not hide the next
      - run: cargo test --release -p scrutate --locked --no-fail-fast
      - run: cargo build --release -p scrutate --locked
      - name: smoke test the binary
        run: |
          ./target/release/scrutate --version
          ./target/release/scrutate grep -F "fn main" crates/scrutate/src
          ./target/release/scrutate --root crates/scrutate index
          ./target/release/scrutate --root crates/scrutate search "parse a file into chunks" -k 3
          ./target/release/scrutate --root crates/scrutate check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scrutate-${{ matrix.os }}
          path: |
            target/release/scrutate
            target/release/scrutate.exe
          if-no-files-found: error
          retention-days: 3
  audit:
    name: advisories against Cargo.lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
          fallback: none
      - run: cargo-audit audit
  dependency-review:
    name: dependencies a pull request adds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
  python:
    name: python training code, bindings, differential, ranking quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # the committed images, charts and document heads are what their scripts write, and no link is broken
      - run: python3 tools/gen_assets.py --check && python3 tools/gen_doc_assets.py --check && python3 bench/make_readme_charts.py --check
      # the licence texts that ship with the wheels and the editor extension are copies of the root ones
      - run: |
          for f in LICENSE-APACHE LICENSE-MIT; do cmp "$f" "crates/scrutate-py/$f" && cmp "$f" "python/$f"; done
          python3 -c "import sys; v = open('integrations/vscode/LICENSE').read(); sys.exit(not all(open(f).read().strip() in v for f in ('LICENSE-MIT', 'LICENSE-APACHE')))"
      # the versions the Python tests were last run with
      - run: pip install -e "python[test]" maturin -c python/constraints.txt
      - run: cargo build --release -p scrutate --locked
      - name: bindings wheel (abi3) and tests
        run: |
          maturin build --release --strip -m crates/scrutate-py/Cargo.toml -o target/wheels
          pip install --force-reinstall --no-deps target/wheels/scrutate-*.whl
          # the bindings tests skip when the module does not load, so a broken wheel fails here
          python -c "import scrutate; print(scrutate.__version__)"
          cd python && SCRUTATE_BIN=$GITHUB_WORKSPACE/target/release/scrutate python -m pytest -q tests
      - name: differential test against ripgrep
        run: |
          sudo apt-get -o Acquire::Retries=5 install -y ripgrep sqlite3
          python bench/differential.py --cases 200 --seed 3
      - name: random checks against ripgrep and a fresh index
        run: |
          python bench/fuzz_grep.py --bin target/release/scrutate --seconds 20 --seed 7
          python bench/fuzz_incremental.py --bin target/release/scrutate --seconds 20 --seed 7
      # MRR@10 and hit@5 of 1,183 queries on a frozen copy of this repository's code, against bench/quality/floor.json
      - name: ranking quality against its recorded floor
        run: python bench/quality.py target/release/scrutate
  # a platform is supported only once its wheel is built, installed and tested there (docs/INSTALL.md)
  wheels:
    name: wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0" # as .cargo/config.toml; maturin reads it for the wheel tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
        # the cp39-abi3 wheel on standard CPython, the cp314t wheel on free-threaded 3.14
        python: ["3.13", "3.14t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install maturin pytest -c python/constraints.txt
      - run: cargo build --release -p scrutate --locked
      - name: build, install and test the wheel
        run: |
          maturin build --release --strip -m crates/scrutate-py/Cargo.toml -o target/wheels -i python
          python -m pip install --no-deps target/wheels/scrutate-*.whl
          # the bindings tests skip when the module does not load, so a broken wheel fails here
          python -c "import scrutate, sys; print(scrutate.__version__, 'gil enabled:', getattr(sys, '_is_gil_enabled', lambda: True)())"
          bin="$GITHUB_WORKSPACE/target/release/scrutate"
          if [ "$RUNNER_OS" = Windows ]; then bin="$bin.exe"; fi
          cd python && SCRUTATE_BIN="$bin" python -m pytest -q tests/test_bindings.py
  musl:
    name: fully static linux binary (musl)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # after the install, so the target lands on the pinned toolchain and not on the runner's default
      - run: rustup toolchain install --no-self-update && rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get -o Acquire::Retries=5 install -y musl-tools
      - run: cargo build --release -p scrutate --locked
      - run: cargo build --release -p scrutate --locked --target x86_64-unknown-linux-musl
      - name: static, identical output, performance difference
        run: |
          m=target/x86_64-unknown-linux-musl/release/scrutate
          file "$m" | grep -qE "statically linked|static-pie linked"
          if ldd "$m" 2>&1 | grep "=>" > /dev/null; then echo "the musl binary loads a shared library"; exit 1; fi
          untimed() { sed -E 's/"elapsed_ms":[0-9.eE+-]+,?//'; } # the summary's run time differs on every run
          ./target/release/scrutate grep --sort --json -F "fn " crates | untimed > /tmp/glibc.jsonl
          "$m" grep --sort --json -F "fn " crates | untimed > /tmp/musl.jsonl
          cmp /tmp/glibc.jsonl /tmp/musl.jsonl
          python3 bench/musl_vs_glibc.py target/release/scrutate "$m" crates
      # the binary the templates' Debian 12 image and the action on Linux x86_64 run: the glibc one
      # from Ubuntu 24.04 asks for GLIBC_2.39 and does not start there
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scrutate-musl
          path: target/x86_64-unknown-linux-musl/release/scrutate
          if-no-files-found: error
          retention-days: 3
  wasi:
    name: wasm32-wasip1 build and the build without pcre2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WASI_SDK: wasi-sdk-34.0-x86_64-linux
      WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # after the install, so the target lands on the pinned toolchain and not on the runner's default
      - run: rustup toolchain install --no-self-update && rustup target add wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: wasi-sdk, the C compiler for SQLite and the tree-sitter grammars
        run: |
          curl -sSfL --retry 5 -o /tmp/wasi-sdk.tar.gz "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/$WASI_SDK.tar.gz"
          echo "$WASI_SDK_SHA256  /tmp/wasi-sdk.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wasi-sdk.tar.gz -C "$RUNNER_TEMP"
          sdk="$RUNNER_TEMP/$WASI_SDK"
          {
            echo "CC_wasm32_wasip1=$sdk/bin/clang"
            echo "AR_wasm32_wasip1=$sdk/bin/llvm-ar"
            echo "CFLAGS_wasm32_wasip1=--sysroot=$sdk/share/wasi-sysroot"
          } >> "$GITHUB_ENV"
      - run: cargo check --target wasm32-wasip1 -p scrutate --no-default-features --locked
      - run: cargo clippy -p scrutate --all-targets --no-default-features --locked -- -D warnings
  compat:
    name: extra-langs feature, oldest supported Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --release -p scrutate --features extra-langs --locked --no-fail-fast
      - name: build with the rust-version Cargo.toml declares
        env:
          RUSTFLAGS: "" # an older compiler does not know the newer lints
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          cargo "+$msrv" check -p scrutate --locked
  fuzz:
    name: fuzz targets and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: ""
      NIGHTLY: nightly-2026-10-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$NIGHTLY" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      # every target, so one that no longer compiles against the crate fails here, not on its next run
      - run: cargo "+$NIGHTLY" fuzz build -O
      - name: every input that once crashed a target
        run: |
          for f in fuzz/regressions/*/*; do
            cargo "+$NIGHTLY" fuzz run -O "$(basename "$(dirname "$f")")" "$f"
          done
  vscode:
    name: VS Code ${{ matrix.vscode }} (${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # the engines.vscode floor in package.json, and the current release
        vscode: [1.85.0, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scrutate-${{ matrix.os }}
          path: bin
      # @vscode/test-electron 3.1.0 and @vscode/vsce 4.1.1 declare node >= 22
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - name: the extension folder, then the packaged .vsix installed with --install-extension
        working-directory: integrations/vscode
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
        run: |
          bin=$GITHUB_WORKSPACE/bin/scrutate
          if [ "$RUNNER_OS" = Windows ]; then bin=$bin.exe; else chmod +x "$bin"; fi
          export SCRUTATE_BIN=$bin
          # Linux runners have no display; macOS and Windows start VS Code directly
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$@"; else "$@"; fi; }
          npm ci
          run npm test
          # the README's banner is an SVG, which vsce refuses once it rewrites relative links
          npm exec --yes --package=@vscode/vsce@4.1.1 -- vsce package --no-rewrite-relative-links --out scrutate.vsix
          unzip -Z1 scrutate.vsix | sort > "$RUNNER_TEMP/vsix-files.txt"
          cat "$RUNNER_TEMP/vsix-files.txt"
          for f in extension/package.json extension/extension.js extension/root.js extension/node_modules/vscode-languageclient/package.json; do
            grep -qx "$f" "$RUNNER_TEMP/vsix-files.txt" || { echo "the package lacks $f"; exit 1; }
          done
          if grep -E '^extension/(test/|\.vscode-test/|tsconfig\.json|node_modules/(@vscode/test-electron|typescript)/)' "$RUNNER_TEMP/vsix-files.txt"; then
            echo "the package holds test or build files"
            exit 1
          fi
          SCRUTATE_VSIX=$PWD/scrutate.vsix run node test/run.js
  neovim:
    name: Neovim ${{ matrix.nvim }} (${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # the plugin's floor, the language server's floor, the current release
        nvim: [v0.10.4, v0.11.7, v0.12.6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scrutate-${{ matrix.os }}
          path: bin
      - name: the plugin in a headless Neovim
        env:
          NVIM: ${{ matrix.nvim }}
        run: |
          case "$RUNNER_OS" in
            Linux) a="nvim-linux-x86_64.tar.gz" ;;
            macOS) a="nvim-macos-arm64.tar.gz" ;;
            Windows) a="nvim-win64.zip" ;;
          esac
          # v0.10.4 from its .sha256sum files; v0.11.7 and v0.12.6 publish none, so the release assets' digests
          case "$NVIM/$a" in
            v0.10.4/nvim-linux-x86_64.tar.gz) sum=95aaa8e89473f5421114f2787c13ae0ec6e11ebbd1a13a1bd6fcf63420f8073f ;;
            v0.10.4/nvim-macos-arm64.tar.gz) sum=3d7b07ec9b491d2a3d55167bc1db1cfa96773a1a37e74ea384cb15ab0189223b ;;
            v0.10.4/nvim-win64.zip) sum=dceeb8301f64e244e3e2dffaedbb153bd01c0c6ecb5024a90e3172dc8e65555c ;;
            v0.11.7/nvim-linux-x86_64.tar.gz) sum=38a7c6317f94503841096c00e8fde05ef04b9472fc9d7d62b6e033cecd6f7991 ;;
            v0.11.7/nvim-macos-arm64.tar.gz) sum=9c84686ce84bbab725ff3d88ca3ac1d6da5a72128b68d9dd8094e34d4049a126 ;;
            v0.11.7/nvim-win64.zip) sum=7b10e6e08b14bf256422b72cfe706ef0452fd9c0a40e138426e1af09803d697f ;;
            v0.12.6/nvim-linux-x86_64.tar.gz) sum=474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87 ;;
            v0.12.6/nvim-macos-arm64.tar.gz) sum=1dbd148222b051ba6c307c4d17a318ed083df018a4f6a5a0ce46955ffc9ab87b ;;
            v0.12.6/nvim-win64.zip) sum=4e12b7103b601ffc8f25954b4da100f339faa73dccb69a5b135e897fa3d893ed ;;
          esac
          bin=$GITHUB_WORKSPACE/bin/scrutate
          if [ "$RUNNER_OS" = Windows ]; then bin=$bin.exe; exe=.exe; else chmod +x "$bin"; exe=; fi
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 5 -o "$a" "https://github.com/neovim/neovim/releases/download/$NVIM/$a"
          if command -v sha256sum > /dev/null; then echo "$sum  $a" | sha256sum -c -; else echo "$sum  $a" | shasum -a 256 -c -; fi
          mkdir nvim
          if [ "$RUNNER_OS" = Windows ]; then unzip -q "$a" -d nvim; else tar xzf "$a" -C nvim; fi
          nvim=$(echo "$PWD"/nvim/*/bin/nvim$exe)
          "$nvim" --version | head -1
          bash "$GITHUB_WORKSPACE/integrations/fixture.sh" repo
          cd repo
          "$nvim" --headless -u NONE -l "$GITHUB_WORKSPACE/integrations/neovim/test/run.lua" "$bin"
  action:
    name: GitHub action from this commit (${{ matrix.os }})
    needs: [rust, musl]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the action installs the musl build on Linux; no aarch64 musl build runs in CI, so on Linux
      # arm64 the glibc binary stands in under that name, on the runner that built it
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.os == 'ubuntu-latest' && 'scrutate-musl' || format('scrutate-{0}', matrix.os) }}
          path: bin
      - name: the CI binary packed as release v0.1.0, which curl then serves
        run: |
          bin=bin/scrutate
          if [ "$RUNNER_OS" = Windows ]; then bin=$bin.exe; fi
          bash tools/fake_release.sh "$bin" 0.1.0
      - id: found
        uses: ./.github/actions/scrutate # zizmor: ignore[self-repository] the action of this commit, as release.yml calls ci.yml
        with:
          version: v0.1.0
          args: grep --sort -F "fn main" crates/scrutate/src
      - id: none
        uses: ./.github/actions/scrutate # zizmor: ignore[self-repository] the action of this commit, as release.yml calls ci.yml
        with:
          version: v0.1.0
          args: grep -F "zzzz_no_such_text_qqqq" crates/scrutate/src
      - name: exit codes in the output, and the installed binary on PATH
        env:
          FOUND: ${{ steps.found.outputs.exit-code }}
          NONE: ${{ steps.none.outputs.exit-code }}
        run: |
          echo "found: $FOUND, none: $NONE"
          [ "$FOUND" = 0 ] && [ "$NONE" = 1 ]
          where=$(command -v scrutate)
          echo "$where"
          case "$where" in *scrutate-0.1.0-*) ;; *) echo "scrutate on PATH is not the installed release"; exit 1 ;; esac
          scrutate --version
