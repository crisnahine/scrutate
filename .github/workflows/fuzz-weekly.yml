# A long fuzzing run of every target in fuzz/fuzz_targets once a week (ci.yml only builds them and
# replays fuzz/regressions). Each target fuzzes for 45 minutes on its own runner, from the corpus
# the last run left; a crash, a timeout or an out-of-memory input fails the run and is uploaded.
name: fuzz-weekly
on:
  schedule:
    - cron: "7 2 * * 6"
  workflow_dispatch:
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: fuzz-weekly
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  NIGHTLY: nightly-2026-10-26 # as ci.yml's fuzz job
jobs:
  targets:
    name: list the fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "targets=$(find fuzz/fuzz_targets -name '*.rs' -printf '%f\n' | sed 's/\.rs$//' | sort | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  fuzz:
    name: fuzz ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    # 45 minutes of fuzzing, the build and the corpus transfers; GitHub's limit is 6 hours
    timeout-minutes: 90
    permissions:
      contents: read # checkout
      actions: read # the corpus artifact of an earlier run
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$NIGHTLY" --profile minimal --no-self-update
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      # an artifact, since a cache unused for 7 days is evicted and this runs every 7 days
      - name: the corpus of the latest earlier run that kept one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          for id in $(gh run list -R "$GITHUB_REPOSITORY" -w fuzz-weekly.yml -s completed -L 10 --json databaseId -q '.[].databaseId'); do
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n "corpus-$TARGET" -D "fuzz/corpus/$TARGET"; then
              echo "corpus of run $id: $(find "fuzz/corpus/$TARGET" -type f | wc -l) inputs"
              break
            fi
          done
      - run: cargo "+$NIGHTLY" fuzz build -O "$TARGET"
      - run: cargo "+$NIGHTLY" fuzz run -O "$TARGET" -- -max_total_time=2700 -print_final_stats=1
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 60
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 90
