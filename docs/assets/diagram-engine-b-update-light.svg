<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 581" width="880" height="581" role="img" aria-labelledby="title desc">
<title id="title">Engine B: one index update</title>
<desc id="desc">Walk, hash, parse and chunk the files; the chunks give rows for SQLite (symbols, call edges, imports) and arrays for a new segment (BM25 postings, int8 vectors); one transaction commits both.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
.m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.h { font-size: 15px; font-weight: 600; fill: #0c0c0e; }
.b { font-size: 14px; fill: #6f6a5e; }
.bi { font-size: 14px; fill: #0c0c0e; }
.lbl { font-size: 14px; font-weight: 600; fill: #6f6a5e; }
.card { fill: #f2eee3; stroke: #cfc9ba; stroke-width: 1; }
.inset { fill: #ffffff; stroke: #cfc9ba; stroke-width: 1; }
.store { fill: #f2eee3; stroke: #0c0c0e; stroke-width: 1.25; }
.out { fill: #f2eee3; stroke: #0c0c0e; stroke-width: 1.25; }
.arrow { fill: none; stroke: #6f6a5e; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.gate { fill: #ffffff; stroke: #6f6a5e; stroke-width: 1.25; stroke-dasharray: 6 5; }

.flow { fill: none; stroke: #0c0c0e; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 10 200;
  stroke-dashoffset: 30; animation: flow 10s cubic-bezier(.2,.7,.2,1) infinite; }
@keyframes flow { 0% { stroke-dashoffset: 30; } 14%, 100% { stroke-dashoffset: -100; } }

.flow { fill: none; stroke: #0c0c0e; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 10 200;
  stroke-dashoffset: 30; animation: flow 10s cubic-bezier(.2,.7,.2,1) infinite; }
@keyframes flow { 0% { stroke-dashoffset: 30; } 14%, 100% { stroke-dashoffset: -100; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#6f6a5e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1" y="1" width="194" height="142" rx="12" class="card"/>
<text x="17" y="27" class="h">Walk</text>
<text x="17" y="49" class="b">Files the ignore</text>
<text x="17" y="69" class="b">rules let through;</text>
<text x="17" y="89" class="b">binary files and</text>
<text x="17" y="109" class="b">files over 1 MB are</text>
<text x="17" y="129" class="b">left out.</text>
<rect x="229" y="1" width="194" height="142" rx="12" class="card"/>
<text x="245" y="27" class="h">Hash</text>
<text x="245" y="49" class="b">Size, mtime and</text>
<text x="245" y="69" class="b"><tspan class="m">ctime_ns</tspan> match:</text>
<text x="245" y="89" class="b">the fast path.</text>
<text x="245" y="109" class="b">Otherwise a SHA-1</text>
<text x="245" y="129" class="b">of the content.</text>
<rect x="457" y="1" width="194" height="142" rx="12" class="card"/>
<text x="473" y="27" class="h">Parse</text>
<text x="473" y="49" class="b">Tree-sitter rules,</text>
<text x="473" y="69" class="b">a keyword</text>
<text x="473" y="89" class="b">heuristic, or line</text>
<text x="473" y="109" class="b">windows.</text>
<rect x="685" y="1" width="194" height="142" rx="12" class="card"/>
<text x="701" y="27" class="h">Chunks</text>
<text x="701" y="49" class="b">One per definition;</text>
<text x="701" y="69" class="b">every other line in</text>
<text x="701" y="89" class="b">overlapping 50-line</text>
<text x="701" y="109" class="b">windows.</text>
<path d="M197 72 L225 72" class="arrow" marker-end="url(#ah)"/>
<path d="M197 72 L225 72" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 0s"/>
<path d="M425 72 L453 72" class="arrow" marker-end="url(#ah)"/>
<path d="M425 72 L453 72" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 0.9s"/>
<path d="M653 72 L681 72" class="arrow" marker-end="url(#ah)"/>
<path d="M653 72 L681 72" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 1.8s"/>
<rect x="1" y="215" width="270" height="122" rx="12" class="card"/>
<text x="17" y="241" class="h">Symbols and call edges</text>
<text x="17" y="263" class="b">Chunk metadata and text,</text>
<text x="17" y="283" class="b">call edges (<tspan class="m">refs</tspan>) and</text>
<text x="17" y="303" class="b"><tspan class="m">imports</tspan>.</text>
<rect x="304" y="215" width="270" height="122" rx="12" class="card"/>
<text x="320" y="241" class="h">BM25 postings</text>
<text x="320" y="263" class="b">Per field, over a shared</text>
<text x="320" y="283" class="b">63-bit token-hash</text>
<text x="320" y="303" class="b">vocabulary.</text>
<rect x="607" y="215" width="270" height="122" rx="12" class="card"/>
<text x="623" y="241" class="h">Vectors</text>
<text x="623" y="263" class="b">int8, two views per chunk</text>
<text x="623" y="283" class="b">(description,</text>
<text x="623" y="303" class="b">implementation); IVF cluster</text>
<text x="623" y="323" class="b">order from 20,000 rows.</text>
<path d="M782 145 L782 177" class="arrow"/>
<path d="M782 145 L782 177" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 2.7s"/>
<path d="M136.0 177 H782.0" class="arrow"/>
<path d="M136 177 L136 211" class="arrow" marker-end="url(#ah)"/>
<path d="M136 177 L136 211" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 3.6s"/>
<path d="M439 177 L439 211" class="arrow" marker-end="url(#ah)"/>
<path d="M439 177 L439 211" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 3.6s"/>
<path d="M742 177 L742 211" class="arrow" marker-end="url(#ah)"/>
<path d="M742 177 L742 211" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 3.6s"/>
<rect x="1" y="397" width="270" height="182" rx="12" class="store"/>
<text x="17" y="423" class="h">SQLite <tspan class="m">index.db</tspan></text>
<text x="17" y="445" class="b"><tspan class="m">files</tspan>, <tspan class="m">chunks</tspan>, <tspan class="m">refs</tspan>,</text>
<text x="17" y="465" class="b"><tspan class="m">imports</tspan>, <tspan class="m">meta</tspan> (with the</text>
<text x="17" y="485" class="b">segment manifest); WAL.</text>
<text x="17" y="505" class="b">One <tspan class="m">BEGIN IMMEDIATE</tspan></text>
<text x="17" y="525" class="b">transaction per update:</text>
<text x="17" y="545" class="b">readers never see a half</text>
<text x="17" y="565" class="b">state.</text>
<rect x="304" y="397" width="573" height="82" rx="12" class="store"/>
<text x="320" y="423" class="h">Segment</text>
<text x="320" y="445" class="b"><tspan class="m">.scrutate/seg/sNNNNNN/</tspan>: immutable, memory-mapped <tspan class="m">.npy</tspan> arrays.</text>
<text x="320" y="465" class="b">Written to a temporary directory, then renamed.</text>
<path d="M136 339 L136 393" class="arrow" marker-end="url(#ah)"/>
<path d="M136 339 L136 393" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 4.5s"/>
<path d="M439 339 L439 393" class="arrow" marker-end="url(#ah)"/>
<path d="M439 339 L439 393" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 4.5s"/>
<path d="M742 339 L742 393" class="arrow" marker-end="url(#ah)"/>
<path d="M742 339 L742 393" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 4.5s"/>
<path d="M302 438 L275 438" class="arrow" marker-end="url(#ah)"/>
<path d="M302 438 L275 438" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 5.4s"/>
</svg>
