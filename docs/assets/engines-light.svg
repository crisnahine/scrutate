<title id="t">Two engines, one binary</title>
<desc id="d">What you ask (the CLI, Python, an MCP client for agents, an LSP client for editors) goes to two engines in one binary. Engine A searches with no index: walk, ignore rules, match, stream, and returns matches. Engine B is the index: parse, symbols, call edges, a text index and a ranker; it returns ranked results, definitions and callers, and references.</desc>
