<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 663" width="880" height="663" role="img" aria-labelledby="title desc">
<title id="title">Engine A: from the command line to output</title>
<desc id="desc">The command line is parsed, the ignore-aware parallel walker visits the files, each file's first read decides its path (small file, stream reader, split file, long lines), and the output is batched per file.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
.m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.h { font-size: 15px; font-weight: 600; fill: #f2eee3; }
.b { font-size: 14px; fill: #8f8f98; }
.bi { font-size: 14px; fill: #f2eee3; }
.lbl { font-size: 14px; font-weight: 600; fill: #8f8f98; }
.card { fill: #0c0c0e; stroke: #2a2a2f; stroke-width: 1; }
.inset { fill: #000000; stroke: #2a2a2f; stroke-width: 1; }
.store { fill: #0c0c0e; stroke: #f2eee3; stroke-width: 1.25; }
.out { fill: #0c0c0e; stroke: #d9ff3d; stroke-width: 1.25; }
.arrow { fill: none; stroke: #8f8f98; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.gate { fill: #000000; stroke: #8f8f98; stroke-width: 1.25; stroke-dasharray: 6 5; }

.flow { fill: none; stroke: #d9ff3d; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 10 200;
  stroke-dashoffset: 30; animation: flow 10s cubic-bezier(.2,.7,.2,1) infinite; }
@keyframes flow { 0% { stroke-dashoffset: 30; } 14%, 100% { stroke-dashoffset: -100; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#8f8f98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1" y="1" width="262" height="222" rx="12" class="card"/>
<text x="17" y="27" class="h">Command line</text>
<text x="17" y="49" class="b"><tspan class="m">scrutate grep PATTERN</tspan></text>
<text x="17" y="69" class="b">Arguments of the plain</text>
<text x="17" y="89" class="b">shapes are read by hand,</text>
<text x="17" y="109" class="b">anything else by clap.</text>
<rect x="309" y="1" width="262" height="222" rx="12" class="card"/>
<text x="325" y="27" class="h">Walk</text>
<text x="325" y="49" class="b">The <tspan class="m">ignore</tspan> parallel</text>
<text x="325" y="69" class="b">walker: <tspan class="m">.gitignore</tspan>,</text>
<text x="325" y="89" class="b"><tspan class="m">.ignore</tspan>, global excludes;</text>
<text x="325" y="109" class="b">hidden files off.</text>
<text x="325" y="129" class="b">Threads: the cores (at most</text>
<text x="325" y="149" class="b">12); on macOS the</text>
<text x="325" y="169" class="b">performance cores; more</text>
<text x="325" y="189" class="b">when files come from the</text>
<text x="325" y="209" class="b">disk.</text>
<rect x="617" y="1" width="262" height="222" rx="12" class="card"/>
<text x="633" y="27" class="h">First read of a file</text>
<text x="633" y="49" class="b">64 KB and one byte. A NUL</text>
<text x="633" y="69" class="b">byte or a byte-order mark</text>
<text x="633" y="89" class="b">sends the file to the</text>
<text x="633" y="109" class="b">stream reader.</text>
<path d="M265 112 L305 112" class="arrow" marker-end="url(#ah)"/>
<path d="M265 112 L305 112" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 0s"/>
<path d="M573 112 L613 112" class="arrow" marker-end="url(#ah)"/>
<path d="M573 112 L613 112" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 1.2s"/>
<rect x="1" y="307" width="206" height="202" rx="12" class="card"/>
<text x="17" y="333" class="h">Small file</text>
<text x="17" y="355" class="b">A short first read is</text>
<text x="17" y="375" class="b">the whole file:</text>
<text x="17" y="395" class="b">searched in the</text>
<text x="17" y="415" class="b">thread's own buffer.</text>
<rect x="225" y="307" width="206" height="202" rx="12" class="card"/>
<text x="241" y="333" class="h">Larger file</text>
<text x="241" y="355" class="b">The stream reader, up</text>
<text x="241" y="375" class="b">to 1 MB with a</text>
<text x="241" y="395" class="b">searcher made for</text>
<text x="241" y="415" class="b">that file.</text>
<rect x="449" y="307" width="206" height="202" rx="12" class="card"/>
<text x="465" y="333" class="h">Split file</text>
<text x="465" y="355" class="b">Ranges of whole lines</text>
<text x="465" y="375" class="b">(8 MB each); one</text>
<text x="465" y="395" class="b">window of ranges per</text>
<text x="465" y="415" class="b">thread.</text>
<rect x="673" y="307" width="206" height="202" rx="12" class="card"/>
<text x="689" y="333" class="h">One long line</text>
<text x="689" y="355" class="b">No line break before</text>
<text x="689" y="375" class="b">the last byte: a</text>
<text x="689" y="395" class="b">plain -F literal</text>
<text x="689" y="415" class="b">reads it in two</text>
<text x="689" y="435" class="b">passes through small</text>
<text x="689" y="455" class="b">buffers; else one</text>
<text x="689" y="475" class="b">buffer of the file's</text>
<text x="689" y="495" class="b">size.</text>
<path d="M457 301 V295 H871 V301" fill="none" stroke="#2a2a2f" stroke-width="1.5"/>
<text x="664" y="287" class="lbl" text-anchor="middle">64 MB or more</text>
<path d="M748 225 L748 249" class="arrow"/>
<path d="M748 225 L748 249" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 2.4s"/>
<path d="M104.0 249 H776.0" class="arrow"/>
<path d="M104 249 L104 303" class="arrow" marker-end="url(#ah)"/>
<path d="M104 249 L104 303" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 3.4s"/>
<path d="M328 249 L328 303" class="arrow" marker-end="url(#ah)"/>
<path d="M328 249 L328 303" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 3.4s"/>
<path d="M552 249 L552 303" class="arrow" marker-end="url(#ah)"/>
<path d="M552 249 L552 303" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 3.4s"/>
<path d="M776 249 L776 303" class="arrow" marker-end="url(#ah)"/>
<path d="M776 249 L776 303" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 3.4s"/>
<rect x="1" y="559" width="878" height="102" rx="12" class="out"/>
<text x="17" y="585" class="h">Output</text>
<text x="17" y="607" class="b">Matches are batched per file and sent to the caller's sink while other threads keep searching; plain</text>
<text x="17" y="627" class="b">piped output shares one 64 KB buffer, so the lines of many files leave in one write.</text>
<text x="17" y="647" class="b">Ctrl-C, <tspan class="m">--max-results</tspan> or a closed pipe cancels the walk between files. <tspan class="m">--sort</tspan> gives path order.</text>
<path d="M104 511 L104 555" class="arrow" marker-end="url(#ah)"/>
<path d="M104 511 L104 555" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 4.6s"/>
<path d="M328 511 L328 555" class="arrow" marker-end="url(#ah)"/>
<path d="M328 511 L328 555" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 4.6s"/>
<path d="M552 511 L552 555" class="arrow" marker-end="url(#ah)"/>
<path d="M552 511 L552 555" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 4.6s"/>
<path d="M776 511 L776 555" class="arrow" marker-end="url(#ah)"/>
<path d="M776 511 L776 555" class="flow" pathLength="100" style="stroke-dasharray: 30.0 200; animation-delay: 4.6s"/>
</svg>
