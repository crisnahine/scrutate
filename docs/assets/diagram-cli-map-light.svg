<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 733" width="880" height="733" role="img" aria-labelledby="title desc">
<title id="title">Command map: scrutate's commands by family</title>
<desc id="desc">Search without an index (grep, tsquery), search the index (search, find, grep --index, batch), code intelligence (symbol, callers, callees, refs, outline, deps, rdeps, similar, dupes), maintenance (index, check, stats, languages, config, completions) and servers (serve, lsp, watch).</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
.m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.h { font-size: 15px; font-weight: 600; fill: #0c0c0e; }
.b { font-size: 14px; fill: #6f6a5e; }
.bi { font-size: 14px; fill: #0c0c0e; }
.lbl { font-size: 14px; font-weight: 600; fill: #6f6a5e; }
.card { fill: #f2eee3; stroke: #cfc9ba; stroke-width: 1; }
.inset { fill: #ffffff; stroke: #cfc9ba; stroke-width: 1; }
.store { fill: #f2eee3; stroke: #0c0c0e; stroke-width: 1.25; }
.out { fill: #f2eee3; stroke: #0c0c0e; stroke-width: 1.25; }
.arrow { fill: none; stroke: #6f6a5e; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.gate { fill: #ffffff; stroke: #6f6a5e; stroke-width: 1.25; stroke-dasharray: 6 5; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#6f6a5e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1" y="1" width="431" height="226" rx="12" class="card"/>
<circle cx="22" cy="22" r="5" fill="#0c0c0e"/>
<text x="35" y="27" class="h">Search, no index</text>
<text x="17" y="57" class="bi"><tspan class="m">grep</tspan></text>
<text x="147" y="57" class="b">alias <tspan class="m">g</tspan>: regex, literal,</text>
<text x="147" y="77" class="b">identifier, fuzzy</text>
<text x="17" y="105" class="bi"><tspan class="m">tsquery</tspan></text>
<text x="147" y="105" class="b">tree-sitter structural query</text>
<rect x="447" y="1" width="432" height="226" rx="12" class="card"/>
<circle cx="468" cy="22" r="5" fill="#0c0c0e"/>
<text x="481" y="27" class="h">Search the index</text>
<text x="463" y="57" class="bi"><tspan class="m">search</tspan></text>
<text x="593" y="57" class="b">alias <tspan class="m">s</tspan>: ranked by meaning,</text>
<text x="593" y="77" class="b">name, identifier</text>
<text x="463" y="105" class="bi"><tspan class="m">find</tspan></text>
<text x="593" y="105" class="b">regex-looking: <tspan class="m">grep</tspan>; otherwise</text>
<text x="593" y="125" class="b">ranked</text>
<text x="463" y="153" class="bi"><tspan class="m">grep --index</tspan></text>
<text x="593" y="153" class="b"><tspan class="m">grep</tspan> through the text index</text>
<text x="463" y="181" class="bi"><tspan class="m">batch</tspan></text>
<text x="593" y="181" class="b">JSON-lines requests, one index</text>
<text x="593" y="201" class="b">open</text>
<rect x="1" y="243" width="878" height="250" rx="12" class="card"/>
<circle cx="22" cy="264" r="5" fill="#0c0c0e"/>
<text x="35" y="269" class="h">Code intelligence</text>
<text x="17" y="299" class="bi"><tspan class="m">symbol</tspan></text>
<text x="217" y="299" class="b">where it is defined</text>
<text x="17" y="327" class="bi"><tspan class="m">callers / callees</tspan></text>
<text x="217" y="327" class="b">call graph edges resolved to definitions</text>
<text x="17" y="355" class="bi"><tspan class="m">refs</tspan></text>
<text x="217" y="355" class="b">every whole-word occurrence, resolved to its definition</text>
<text x="17" y="383" class="bi"><tspan class="m">outline</tspan></text>
<text x="217" y="383" class="b">symbols of a file in source order</text>
<text x="17" y="411" class="bi"><tspan class="m">deps / rdeps</tspan></text>
<text x="217" y="411" class="b">imports of a file / files importing a module or file</text>
<text x="17" y="439" class="bi"><tspan class="m">similar</tspan></text>
<text x="217" y="439" class="b">code similar to a symbol or <tspan class="m">path:line</tspan></text>
<text x="17" y="467" class="bi"><tspan class="m">dupes</tspan></text>
<text x="217" y="467" class="b">exact and near-duplicate functions</text>
<rect x="1" y="509" width="431" height="222" rx="12" class="card"/>
<circle cx="22" cy="530" r="5" fill="#0c0c0e"/>
<text x="35" y="535" class="h">Maintenance</text>
<text x="17" y="565" class="bi"><tspan class="m">index</tspan></text>
<text x="147" y="565" class="b">build or update <tspan class="m">.scrutate/</tspan></text>
<text x="17" y="593" class="bi"><tspan class="m">check</tspan></text>
<text x="147" y="593" class="b">verify the index</text>
<text x="17" y="621" class="bi"><tspan class="m">stats</tspan></text>
<text x="147" y="621" class="b">index statistics</text>
<text x="17" y="649" class="bi"><tspan class="m">languages</tspan></text>
<text x="147" y="649" class="b">the capability registry</text>
<text x="17" y="677" class="bi"><tspan class="m">config</tspan></text>
<text x="147" y="677" class="b">the configuration file in effect</text>
<text x="17" y="705" class="bi"><tspan class="m">completions</tspan></text>
<text x="147" y="705" class="b">shell completion scripts</text>
<rect x="447" y="509" width="432" height="222" rx="12" class="card"/>
<circle cx="468" cy="530" r="5" fill="#0c0c0e"/>
<text x="481" y="535" class="h">Servers</text>
<text x="463" y="565" class="bi"><tspan class="m">serve</tspan></text>
<text x="593" y="565" class="b">MCP server on stdio</text>
<text x="463" y="593" class="bi"><tspan class="m">lsp</tspan></text>
<text x="593" y="593" class="b">language server on stdio</text>
<text x="463" y="621" class="bi"><tspan class="m">watch</tspan></text>
<text x="593" y="621" class="b">keep the index up to date</text>
</svg>
