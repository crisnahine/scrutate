<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 426" width="880" height="426" role="img" aria-labelledby="title desc">
<title id="title">Platforms: what is built, tested and supported</title>
<desc id="desc">macOS arm64, Linux aarch64 and Linux x86_64 are supported, with binaries and wheels built and tested. macOS x86_64, Windows x86_64 and Windows ARM64 pass the Rust tests on GitHub runners but have no wheel yet, so they are not supported yet.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
.m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.h { font-size: 15px; font-weight: 600; fill: #1f2328; }
.b { font-size: 14px; fill: #59636e; }
.bi { font-size: 14px; fill: #1f2328; }
.lbl { font-size: 14px; font-weight: 600; fill: #59636e; }
.card { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1; }
.inset { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
.store { fill: #f6f8fa; stroke: #6d28d9; stroke-width: 1.25; }
.out { fill: #f6f8fa; stroke: #0f766e; stroke-width: 1.25; }
.arrow { fill: none; stroke: #59636e; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.gate { fill: #ffffff; stroke: #59636e; stroke-width: 1.25; stroke-dasharray: 6 5; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#59636e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="18" y="22" class="lbl">Platform</text>
<text x="176" y="22" class="lbl">Binary</text>
<text x="556" y="22" class="lbl">Wheels</text>
<text x="716" y="22" class="lbl">Status</text>
<rect x="1" y="36" width="878" height="388" rx="12" class="card"/>
<text x="18" y="65" class="h">macOS arm64</text>
<text x="176" y="64" class="b">Built and tested natively.</text>
<text x="556" y="65" class="b">cp39-abi3, cp314t</text>
<rect x="712" y="47.0" width="104" height="26" rx="13" fill="none" stroke="#1a7f37" stroke-width="1.25"/>
<path d="M724 60.0 l4 4 7-8" fill="none" stroke="#1a7f37" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
<text x="742" y="65" class="b">supported</text>
<line x1="2" y1="84" x2="878" y2="84" stroke="#d1d9e0"/>
<text x="18" y="112" class="h">Linux aarch64</text>
<text x="176" y="112" class="b">Built and tested in a clean container;</text>
<text x="176" y="132" class="b">glibc and static musl.</text>
<text x="556" y="112" class="b">cp39-abi3, cp314t</text>
<rect x="712" y="105.0" width="104" height="26" rx="13" fill="none" stroke="#1a7f37" stroke-width="1.25"/>
<path d="M724 118.0 l4 4 7-8" fill="none" stroke="#1a7f37" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
<text x="742" y="123" class="b">supported</text>
<line x1="2" y1="152" x2="878" y2="152" stroke="#d1d9e0"/>
<text x="18" y="180" class="h">Linux x86_64</text>
<text x="176" y="180" class="b">Cross-built on arm64; the Linux tests run</text>
<text x="176" y="200" class="b">in an amd64 container.</text>
<text x="556" y="180" class="b">cp39-abi3, cp314t</text>
<rect x="712" y="173.0" width="104" height="26" rx="13" fill="none" stroke="#1a7f37" stroke-width="1.25"/>
<path d="M724 186.0 l4 4 7-8" fill="none" stroke="#1a7f37" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
<text x="742" y="191" class="b">supported</text>
<line x1="2" y1="220" x2="878" y2="220" stroke="#d1d9e0"/>
<text x="18" y="248" class="h">macOS x86_64</text>
<text x="176" y="248" class="b">Tests pass on GitHub's <tspan class="m">macos-15-intel</tspan></text>
<text x="176" y="268" class="b">runner.</text>
<text x="556" y="248" class="b">not built</text>
<rect x="712" y="241.0" width="150" height="26" rx="13" fill="none" stroke="#d1d9e0" stroke-width="1.25"/>
<text x="726" y="259" class="b">not supported yet</text>
<line x1="2" y1="288" x2="878" y2="288" stroke="#d1d9e0"/>
<text x="18" y="316" class="h">Windows x86_64</text>
<text x="176" y="316" class="b">Tests pass on GitHub's <tspan class="m">windows-latest</tspan></text>
<text x="176" y="336" class="b">runner.</text>
<text x="556" y="316" class="b">not built</text>
<rect x="712" y="309.0" width="150" height="26" rx="13" fill="none" stroke="#d1d9e0" stroke-width="1.25"/>
<text x="726" y="327" class="b">not supported yet</text>
<line x1="2" y1="356" x2="878" y2="356" stroke="#d1d9e0"/>
<text x="18" y="384" class="h">Windows ARM64</text>
<text x="176" y="384" class="b">Tests pass on GitHub's <tspan class="m">windows-11-arm</tspan></text>
<text x="176" y="404" class="b">runner.</text>
<text x="556" y="384" class="b">not built</text>
<rect x="712" y="377.0" width="150" height="26" rx="13" fill="none" stroke="#d1d9e0" stroke-width="1.25"/>
<text x="726" y="395" class="b">not supported yet</text>
</svg>
