<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 162" width="880" height="162" role="img" aria-labelledby="title desc">
<title id="title">Exit codes</title>
<desc id="desc">0: results found. 1: no results. 2: error. 130: interrupted.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
.m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.h { font-size: 15px; font-weight: 600; fill: #0c0c0e; }
.b { font-size: 14px; fill: #6f6a5e; }
.bi { font-size: 14px; fill: #0c0c0e; }
.lbl { font-size: 14px; font-weight: 600; fill: #6f6a5e; }
.card { fill: #f2eee3; stroke: #cfc9ba; stroke-width: 1; }
.inset { fill: #ffffff; stroke: #cfc9ba; stroke-width: 1; }
.store { fill: #f2eee3; stroke: #0c0c0e; stroke-width: 1.25; }
.out { fill: #f2eee3; stroke: #0c0c0e; stroke-width: 1.25; }
.arrow { fill: none; stroke: #6f6a5e; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.gate { fill: #ffffff; stroke: #6f6a5e; stroke-width: 1.25; stroke-dasharray: 6 5; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#6f6a5e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1" y="1" width="208" height="160" rx="12" class="card"/>
<text x="17" y="38" class="m" style="font-size: 28px; font-weight: 700" fill="#0c0c0e">0</text>
<text x="17" y="62" class="h">results found</text>
<rect x="224.67" y="1" width="208" height="160" rx="12" class="card"/>
<text x="240.67" y="38" class="m" style="font-size: 28px; font-weight: 700" fill="#6f6a5e">1</text>
<text x="240.67" y="62" class="h">no results</text>
<rect x="448.34" y="1" width="208" height="160" rx="12" class="card"/>
<text x="464.34" y="38" class="m" style="font-size: 28px; font-weight: 700" fill="#ff5a36">2</text>
<text x="464.34" y="62" class="h">error</text>
<text x="464.34" y="86" class="b">Bad arguments, an</text>
<text x="464.34" y="106" class="b">unreadable index, an</text>
<text x="464.34" y="126" class="b">invalid pattern...</text>
<rect x="672.01" y="1" width="208" height="160" rx="12" class="card"/>
<text x="688.01" y="38" class="m" style="font-size: 28px; font-weight: 700" fill="#ff5a36">130</text>
<text x="688.01" y="62" class="h">interrupted</text>
<text x="688.01" y="86" class="b">Ctrl-C, or stopped</text>
<text x="688.01" y="106" class="b">early for a reason</text>
<text x="688.01" y="126" class="b">other than</text>
<text x="688.01" y="146" class="b"><tspan class="m">--max-results</tspan>.</text>
</svg>
