.brand { font-size: 14px; fill: #59636e; letter-spacing: .5px; }
.code { fill: #d1d9e0; }
.hit { fill: #0f766e; }
.band { fill: #0f766e; opacity: 0.12; }
.beam { animation: sweep 12s cubic-bezier(.2,.7,.2,1) infinite; }
.lit { animation: lit 12s cubic-bezier(.2,.7,.2,1) infinite; }
@keyframes sweep { 0% { transform: translateX(-196px); opacity: 0; } 5% { opacity: 1; }
  45% { transform: translateX(0); opacity: 1; } 92% { transform: translateX(0); opacity: 1; }
  100% { transform: translateX(0); opacity: 0; } }
@keyframes lit { 0%, 44% { opacity: 0; } 52%, 92% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
