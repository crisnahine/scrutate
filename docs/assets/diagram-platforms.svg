<title id="t">Platforms: what is built, tested and supported</title>
<desc id="d">macOS arm64, Linux aarch64 and Linux x86_64 are supported, with binaries and wheels built and tested. macOS x86_64, Windows x86_64 and Windows ARM64 pass the Rust tests on GitHub runners but have no wheel yet, so they are not supported yet.</desc>
