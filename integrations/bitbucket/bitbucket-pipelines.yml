# Bitbucket Pipelines template: Scrutate duplicate-code report on every push.
image: debian:bookworm-slim
definitions:
  steps:
    - step: &scrutate
        name: scrutate
        script:
          - apt-get update -qq && apt-get install -y -qq curl ca-certificates > /dev/null
          - export V=0.1.0 NAME="scrutate-0.1.0-x86_64-unknown-linux-musl"
          - export URL="https://github.com/crisnahine/scrutate/releases/download/v$V"
          # in /tmp, so the tool does not index its own files
          - curl -sSfL -o "/tmp/$NAME.tar.gz" "$URL/$NAME.tar.gz"
          - curl -sSfL -o "/tmp/$NAME.sha256" "$URL/$NAME.sha256"
          - (cd /tmp && sha256sum -c "$NAME.sha256")
          - tar xzf "/tmp/$NAME.tar.gz" -C /tmp && export PATH="/tmp/$NAME:$PATH"
          - scrutate index
          # exit status 1 means no duplicates, which is not a failed step; 2 is an error
          - scrutate dupes --json --min-tokens 60 > scrutate-dupes.json || [ $? -eq 1 ]
        artifacts:
          - scrutate-dupes.json
pipelines:
  default:
    - step: *scrutate
