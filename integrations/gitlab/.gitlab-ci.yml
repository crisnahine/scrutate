# GitLab CI template: run Scrutate checks on every merge request (duplicate code report and a
# query the team cares about). Copy into your repository's .gitlab-ci.yml or `include:` it.
variables:
  SCRUTATE_VERSION: "0.1.0"
scrutate:
  image: debian:bookworm-slim
  stage: test
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates > /dev/null
    - name="scrutate-${SCRUTATE_VERSION}-x86_64-unknown-linux-musl"
    - curl -sSfL -o "$name.tar.gz" "https://github.com/crisnahine/scrutate/releases/download/v${SCRUTATE_VERSION}/$name.tar.gz"
    - curl -sSfL -o "$name.sha256" "https://github.com/crisnahine/scrutate/releases/download/v${SCRUTATE_VERSION}/$name.sha256"
    - grep "$name.tar.gz" "$name.sha256" | sha256sum -c -
    - tar xzf "$name.tar.gz" && export PATH="$PWD/$name:$PATH"
  script:
    - scrutate index
    - scrutate dupes --json --min-tokens 60 > scrutate-dupes.json
    - scrutate grep -F --json "TODO(security)" . > scrutate-todos.jsonl || true
  artifacts:
    paths: [scrutate-dupes.json, scrutate-todos.jsonl]
    expire_in: 1 week
