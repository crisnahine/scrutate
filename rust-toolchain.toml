# Pinned so every machine builds with the same compiler: release binaries are reproducible across
# build environments only with the same toolchain (tools/repro_docker.sh checks two of them).
# The crate itself needs stable Rust >= 1.91 (`rust-version` in Cargo.toml).
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
